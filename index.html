<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e6e6; --muted:#8b93a1; --card:#181b22; --line:#2a2f3a; --accent:#4f7cff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#14161a; --muted:#5d6675; --card:#fff; --line:#dfe3ea; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; padding:16px; }
  main { width:100%; max-width:620px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  button { padding:12px 18px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  small { display:block; margin-top:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Web proxy</h1>
  <p>Enter a URL or a search term.</p>
  <form id="f">
    <input id="u" type="text" autocomplete="off" autofocus placeholder="example.com or https://example.com/page" aria-label="URL">
    <button>Go</button>
  </form>
  <small>Redirects (HTTP, meta refresh, JavaScript) stay inside the proxy.</small>
</main>
<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('u').value.trim();
    if (!v) return;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) {
      v = (/^[^\s]+\.[^\s]{2,}$/.test(v) || /^localhost/.test(v)) ? 'https://' + v
        : 'https://duckduckgo.com/html/?q=' + encodeURIComponent(v);
    }
    try {
      var u = new URL(v);
      location.href = '/p/' + u.protocol.slice(0, -1) + '/' + u.host + u.pathname + u.search + u.hash;
    } catch (err) { alert('That does not look like a valid URL'); }
  });
</script>
</body>
</html>
